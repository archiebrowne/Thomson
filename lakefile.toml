name = "Thomson"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Thomson", "Solution", "challenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "d1298f10aed809aecc68eba075a2b95d1d850798"

[[lean_lib]]
name = "Thomson"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "challenge"
